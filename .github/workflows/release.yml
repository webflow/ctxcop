# Release pipeline — fires on `v*` tag push. Source-only pending macOS
# notarization; see PR #5. Build/cosign/SBOM/attest pipeline is in git
# history to restore once that's wired in.

name: release

on:
  push:
    tags: ['v*']

# Workflow-level: read-only. Each job escalates only what it needs.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # --- 1. Gate on a signed annotated tag from an allowed signer -----
  validate-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # need tag history + tag object for verification
      - name: verify signed annotated tag
        run: ./.github/scripts/verify-release-tag.sh

  # --- 2. Publish a source-only GitHub Release ----------------------
  publish-source-release:
    needs: validate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release  # required-reviewer gate, prevent_self_review
    permissions:
      contents: write  # create the GitHub Release
    steps:
      # Audit-only egress visibility on the one job in this repo that
      # holds a write-scoped token behind an environment gate. See
      # .github/action-allowlist.txt for the scoping rationale. Never
      # blocking — this is observation, not enforcement.
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: publish GitHub Release (source only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/}"
          PRERELEASE=""
          if [[ "${VERSION}" =~ -(rc|alpha|beta)\. ]]; then
            PRERELEASE=--prerelease
          fi

          notes_file=$(mktemp)
          if grep -q "^## \[${VERSION#v}\]" CHANGELOG.md; then
            awk -v v="${VERSION#v}" '
              $0 ~ "^## \\["v"\\]" {flag=1; next}
              flag && /^## \[/        {flag=0}
              flag                    {print}
            ' CHANGELOG.md > "$notes_file"
          else
            echo "_No CHANGELOG entry for ${VERSION}; see commit log._" > "$notes_file"
          fi
          {
            echo
            echo "---"
            echo "No prebuilt binaries: macOS Gatekeeper rejects an"
            echo "ad-hoc-signed binary, and Developer ID codesigning +"
            echo "notarization isn't wired into this pipeline yet."
            echo "Build from source: \`go build ./cmd/ctxcop\`."
          } >> "$notes_file"

          gh release create "${VERSION}" \
            --title "${VERSION}" \
            --notes-file "$notes_file" \
            $PRERELEASE
