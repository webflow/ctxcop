# Release pipeline — fires on `v*` tag push.
#
# Source-only for now: v0.1.0 shipped prebuilt macOS binaries that
# Gatekeeper rejects outright (ad-hoc/linker-signed only, no Apple
# Developer ID). We're enrolled in the Apple Developer Program but the
# signing cert isn't provisioned yet, so this pipeline publishes the
# GitHub Release from the tag with no binary assets — install is
# build-from-source until codesigning + notarization land. The full
# build/cosign/SBOM/attest pipeline that produced v0.1.0's binaries is
# still in git history (this commit's parent) to restore from once the
# cert is ready.
#
# webflow/homebrew-ctxcop polls this repo's binary releases to bump its
# formula — it has nothing to bump until binaries come back.

name: release

on:
  push:
    tags: ['v*']

# Workflow-level: read-only. Each job escalates only what it needs.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # --- 1. Gate on a signed annotated tag from an allowed signer -----
  validate-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # need tag history + tag object for verification
      - name: verify signed annotated tag
        run: ./.github/scripts/verify-release-tag.sh

  # --- 2. Publish a source-only GitHub Release ----------------------
  publish-source-release:
    needs: validate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Manual approval gate: the `release` environment carries a
    # required-reviewer protection (the tag-pusher plus
    # @webflow/infrastructure-security, with `prevent_self_review: true`),
    # so the run halts here until a reviewer other than whoever pushed
    # the tag approves.
    environment: release
    permissions:
      contents: write  # create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: publish GitHub Release (source only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/}"
          PRERELEASE=""
          if [[ "${VERSION}" =~ -(rc|alpha|beta)\. ]]; then
            PRERELEASE=--prerelease
          fi

          notes_file=$(mktemp)
          if grep -q "^## \[${VERSION#v}\]" CHANGELOG.md; then
            awk -v v="${VERSION#v}" '
              $0 ~ "^## \\["v"\\]" {flag=1; next}
              flag && /^## \[/        {flag=0}
              flag                    {print}
            ' CHANGELOG.md > "$notes_file"
          else
            echo "_No CHANGELOG entry for ${VERSION}; see commit log._" > "$notes_file"
          fi
          {
            echo
            echo "---"
            echo "No prebuilt binaries: macOS Gatekeeper rejects an"
            echo "ad-hoc-signed binary, and Developer ID codesigning +"
            echo "notarization isn't wired into this pipeline yet."
            echo "Build from source: \`go build ./cmd/ctxcop\`."
          } >> "$notes_file"

          gh release create "${VERSION}" \
            --title "${VERSION}" \
            --notes-file "$notes_file" \
            $PRERELEASE
